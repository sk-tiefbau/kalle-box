<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json?v=5">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Kalle Box V2 – SK Erd- und Tiefbau GmbH</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0.1); }
    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      background: #f1f5f9;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .topbar {
      background: #0f172a;
      color: #fff;
      padding: 14px 16px;
      border-bottom: 4px solid #f59e0b;
    }
    .topbar h1 { margin: 0; font-size: 19px; display: flex; align-items: center; gap: 8px; }
    .topbar p { margin: 3px 0 0; font-size: 12.5px; color: #cbd5e1; }

    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      padding: 10px 12px 0;
      max-width: 680px;
      margin: 0 auto;
      position: relative;
      z-index: 50;
    }
    .nav-btn {
      padding: 14px 4px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      font-weight: bold;
      font-size: 13.5px;
      color: #334155;
      cursor: pointer;
      text-align: center;
      touch-action: manipulation;
      -webkit-appearance: none;
    }
    .nav-btn.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #fff;
    }
    .nav-btn.intern.active {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #fff;
    }

    .wrap {
      max-width: 680px;
      margin: 10px auto 28px;
      padding: 0 12px;
      position: relative;
      z-index: 10;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #334155;
      margin: 14px 0 6px;
    }
    label:first-child { margin-top: 0; }

    select, input {
      width: 100%;
      padding: 13px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
      background: #fff;
      color: #0f172a;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .gps-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 12px;
    }
    .gps-btn {
      border: none;
      border-radius: 10px;
      padding: 13px 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
    }
    .gps-start { background: #dbeafe; color: #1e3a8a; border: 2px solid #3b82f6; }
    .gps-end { background: #dcfce7; color: #14532d; border: 2px solid #22c55e; }
    .gps-status { font-size: 11.5px; font-weight: normal; display: block; margin-top: 4px; }

    .fav-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .fav-chip {
      background: #e2e8f0;
      border: none;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: bold;
      color: #1e293b;
      cursor: pointer;
    }

    .fill-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .fill-btn {
      padding: 10px 4px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .fill-btn.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }

    .cam-box {
      border: 2px dashed #94a3b8;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      background: #f8fafc;
    }
    .cam-btn {
      display: inline-block;
      background: #334155;
      color: #fff;
      padding: 11px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .info-pill {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 9px;
      padding: 12px 14px;
      font-size: 13.5px;
      margin-top: 8px;
      margin-bottom: 12px;
      line-height: 1.45;
      color: #1e3a8a;
    }

    .price-card {
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      border-radius: 10px;
      padding: 14px;
      margin: 16px 0;
    }
    .price-title { font-size: 12px; font-weight: bold; color: #166534; text-transform: uppercase; }
    .price-val { font-size: 22px; font-weight: bold; color: #0f172a; margin: 3px 0; }
    .price-sub { font-size: 13px; color: #475569; }

    .sig-box {
      border: 2px dashed #64748b;
      border-radius: 10px;
      background: #f8fafc;
      margin-top: 6px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      width: 100%;
      height: 195px;
      display: block;
      border-radius: 8px;
      touch-action: none;
    }
    .sig-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 13px;
      color: #64748b;
    }
    .btn-small {
      background: #e2e8f0;
      color: #0f172a;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13.5px;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 17px;
      border-radius: 11px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-intern { background: #1d4ed8; }

    .sub-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .sub-btn {
      padding: 11px 8px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }
    .sub-btn.active {
      background: #f59e0b;
      border-color: #d97706;
